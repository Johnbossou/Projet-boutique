name: Backend Tests (Laravel)

on:
  push:
    branches: [main]
    paths:
      - 'sgci-backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sgci-backend/**'

jobs:
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgci-backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, zip, sqlite3
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: composer config -g cache-dir

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.cache-dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Show PHP version
        run: php -v

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Lint PHP files
        run: |
          find app routes tests database -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'