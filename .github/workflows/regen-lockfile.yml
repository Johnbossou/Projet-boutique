name: Regen frontend lockfile (Linux)

on:
  workflow_dispatch:

concurrency:
  group: lockfile-regen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  regen:
    name: Regenerate package-lock.json on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgci-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild lockfile from package.json
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Verify Linux native binaries are present
        run: |
          grep -c 'node_modules/lightningcss-linux-x64-gnu' package-lock.json
          node -e "const l=require('./package-lock.json'); console.log('lockfileVersion', l.lockfileVersion)"

      - name: Verify build passes on Linux
        run: |
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sgci-frontend/package-lock.json
          git commit -m "chore(frontend): regen package-lock.json (binaires natifs Linux)" || echo "no changes"
          git push origin HEAD:main
        working-directory: .