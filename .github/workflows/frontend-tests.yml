name: Frontend Build & Tests

on:
  push:
    branches: [main]
    paths:
      - 'sgci-frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sgci-frontend/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgci-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type-check & production build
        run: npm run build

      - name: Run Jest tests
        run: npm test -- --ci --runInBand