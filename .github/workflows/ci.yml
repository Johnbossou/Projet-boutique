name: SGCI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend - PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgci-backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite, sqlite3
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('sgci-backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Les tests utilisent SQLite :memory: via phpunit.xml (RefreshDatabase),
      # aucune migration manuelle ni service MySQL nécessaires.
      - name: Run tests
        run: php artisan test

  frontend-tests:
    name: Frontend - Jest & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgci-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api

  mobile-typecheck:
    name: Mobile - TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sgci-mobile/mobile-vs-emulator

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sgci-mobile/mobile-vs-emulator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  deploy:
    name: Deploy (Railway + Vercel)
    needs: [backend-tests, frontend-tests, mobile-typecheck]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # --- Backend : Railway (service sgci-backend, déploiement via Dockerfile) ---
      # Secret requis : RAILWAY_TOKEN (Service token Railway lié au projet sgci-backend).
      # Projet/environnement/service passés directement en arguments (IDs non sensibles),
      # sans 'railway link' (non fiable en CI) : la CLI déploie depuis le checkout.
      - name: Deploy backend to Railway
        working-directory: sgci-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: eb16de27-bf75-4e60-9461-1b8f42bf4d8e
          RAILWAY_ENVIRONMENT_ID: 243e1ee2-dfed-462d-b9fe-0b5a82c78e0b
          RAILWAY_SERVICE_ID: 676a764d-630e-446a-84d5-8114c326825f
        run: |
          npm install -g @railway/cli
          railway up --ci --detach --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" --service "$RAILWAY_SERVICE_ID"

      # --- Frontend : Vercel (projet sgci-frontend) ---
      # Secrets requis : VERCEL_TOKEN (token d'accès Vercel).
      # orgId / projectId proviennent de .vercel/project.json (non sensibles).
      - name: Deploy frontend to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_IzRvIr1v8ia6AOS0AYmy7hgM
          vercel-project-id: prj_REE1OCr3uCbODSQxKDShJtGZiKD2
          working-directory: sgci-frontend
          vercel-args: --prod --yes
