# ══════════════════════════════════════
# COMPONENTS
# ══════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BoutiqueId:
      name: boutique
      in: path
      required: true
      schema:
        type: integer
      description: "ID de la boutique"
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
      description: "ID de l'utilisateur"
    ProduitId:
      name: produit
      in: path
      required: true
      schema:
        type: integer
      description: "ID du produit"
    CategorieId:
      name: categorie
      in: path
      required: true
      schema:
        type: integer
      description: "ID de la categorie"
    VenteId:
      name: vente
      in: path
      required: true
      schema:
        type: integer
      description: "ID de la vente"
    ClientId:
      name: client
      in: path
      required: true
      schema:
        type: integer
      description: "ID du client"
    FournisseurId:
      name: fournisseur
      in: path
      required: true
      schema:
        type: integer
      description: "ID du fournisseur"
    CommandeId:
      name: commande
      in: path
      required: true
      schema:
        type: integer
      description: "ID de la commande"
    DevisId:
      name: devis
      in: path
      required: true
      schema:
        type: integer
      description: "ID du devis"
    FactureId:
      name: facture
      in: path
      required: true
      schema:
        type: integer
      description: "ID de la facture"
    RetourId:
      name: retour
      in: path
      required: true
      schema:
        type: integer
      description: "ID du retour"
    InventaireId:
      name: inventaire
      in: path
      required: true
      schema:
        type: integer
      description: "ID de l'inventaire"
    AuditLogId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: "ID du journal d'audit"

  responses:
    Unauthorized:
      description: "Non authentifie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Unauthenticated."
    Forbidden:
      description: "Role insuffisant"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Forbidden."
    NotFound:
      description: "Ressource non trouvee (ou appartient a une autre boutique)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Not found."
    Validation:
      description: "Erreur de validation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error422"

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    Error422:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [proprietaire, gerant, caissier]
        current_boutique_id:
          type: integer
        two_factor_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time

    Boutique:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time

    Produit:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        description:
          type: string
        code_barres:
          type: string
        prix_vente:
          type: number
          format: float
        prix_achat:
          type: number
          format: float
        quantite_stock:
          type: integer
        stock_min:
          type: integer
        image:
          type: string
        categorie_id:
          type: integer
        boutique_id:
          type: integer
        created_at:
          type: string
          format: date-time

    Vente:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        user_id:
          type: integer
        boutique_id:
          type: integer
        montant_total:
          type: number
          format: float
        mode_paiement:
          type: string
        statut:
          type: string
        created_at:
          type: string
          format: date-time

    Client:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
          format: email
        telephone:
          type: string
        adresse:
          type: string
        is_vip:
          type: boolean
        boutique_id:
          type: integer
        created_at:
          type: string
          format: date-time

    Fournisseur:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        contact_nom:
          type: string
        email:
          type: string
        telephone:
          type: string
        adresse:
          type: string
        boutique_id:
          type: integer
        created_at:
          type: string
          format: date-time

    CommandeFournisseur:
      type: object
      properties:
        id:
          type: integer
        fournisseur_id:
          type: integer
        boutique_id:
          type: integer
        statut:
          type: string
        montant_total:
          type: number
          format: float
        date_livraison_prevue:
          type: string
          format: date
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    RetourVente:
      type: object
      properties:
        id:
          type: integer
        vente_id:
          type: integer
        boutique_id:
          type: integer
        motif:
          type: string
        statut:
          type: string
        montant_total:
          type: number
          format: float
        created_at:
          type: string
          format: date-time

    Devis:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        boutique_id:
          type: integer
        statut:
          type: string
        montant_total:
          type: number
          format: float
        date_validite:
          type: string
          format: date
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    Facture:
      type: object
      properties:
        id:
          type: integer
        numero:
          type: string
        boutique_id:
          type: integer
        montant_total:
          type: number
          format: float
        statut:
          type: string
        source_type:
          type: string
        source_id:
          type: integer
        created_at:
          type: string
          format: date-time

    TransfertStock:
      type: object
      properties:
        id:
          type: integer
        produit_id:
          type: integer
        boutique_source_id:
          type: integer
        boutique_destination_id:
          type: integer
        quantite:
          type: integer
        statut:
          type: string
        motif:
          type: string
        created_at:
          type: string
          format: date-time

    ProgrammeFidelite:
      type: object
      properties:
        id:
          type: integer
        nom:
          type: string
        description:
          type: string
        taux_points:
          type: number
          format: float
        points_min_retrait:
          type: integer
        boutique_id:
          type: integer
        actif:
          type: boolean
        created_at:
          type: string
          format: date-time
