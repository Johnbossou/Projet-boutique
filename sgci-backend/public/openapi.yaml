openapi: 3.0.0
info:
  title: "SGCI Benin API"
  version: "1.2.0"
  description: |
    API REST pour le systeme de gestion commerciale et d'inventaire SGCI Benin.

    ## Authentification
    Toutes les routes authentifiees necessitent l'en-tete `Authorization: Bearer <token>` (Laravel Sanctum).

    ## Multi-tenancy
    Toutes les ressources sont isolees boutique par boutique. La boutique courante est definie via `POST /switch-boutique` ; chaque operation est automatiquement scopee a cette boutique. Toute tentative d'acces a une ressource d'une autre boutique renvoie 404.

    ## Roles
    - **proprietaire** : acces complet, gestion des boutiques et de l'equipe.
    - **gerant** : gestion des operations quotidiennes (ventes, stock, fournisseurs, etc.).
    - **caissier** : accès en lecture et operations de vente basees.

    Certaines routes exigent le role `gerant` ou `proprietaire`. D'autres sont reservees au `proprietaire` uniquement.
  contact:
    name: SGCI Benin
  license:
    name: Proprietaire

servers:
  - url: /
    description: Serveur local
  - url: "https://sgci-backend-production.up.railway.app"
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Authentification, inscription, mot de passe, 2FA
  - name: Multi-boutique
    description: Gestion de la boutique courante et de ses parametres
  - name: Utilisateurs & Equipe
    description: Gestion des utilisateurs, equipes et roles
  - name: Produits
    description: Catalogue de produits et images
  - name: Categories
    description: Categories de produits
  - name: Stock
    description: Mouvements de stock, alertes, transferts, peremption
  - name: Ventes
    description: Ventes, caisse et synchronisation hors ligne
  - name: Clients
    description: Gestion de la base clients et programme VIP
  - name: Fournisseurs
    description: Gestion des fournisseurs
  - name: Commandes
    description: Commandes fournisseurs et commandes clients
  - name: Devis
    description: Devis et conversion en commande
  - name: Factures
    description: Generation et envoi de factures
  - name: Retours
    description: Retours sur ventes
  - name: Inventaire
    description: Inventaires physiques et ecarts
  - name: Fidelite
    description: Programme de fidelite, points et recompenses
  - name: Mobile Money
    description: Paiements mobile money (MTN, Moov, etc.)
  - name: Notifications
    description: Notifications et alertes
  - name: Messagerie
    description: Chat et conversations internes
  - name: Analytics
    description: Statistiques et tableaux de bord
  - name: IA & Previsions
    description: Predictions, recommandations et intelligence artificielle
  - name: Audit
    description: Journaux d'audit et traçabilite

paths:
  # ──────────────────────────────────────
  # PUBLIC
  # ──────────────────────────────────────
  /api/health:
    get:
      tags: [Auth]
      summary: "Verifier l'etat de l'API"
      description: "Endpoint publique pour verifier que l'API fonctionne."
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: "API operative"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/register:
    post:
      tags: [Auth]
      summary: "Creer un compte"
      description: "Inscription d'un nouvel utilisateur. Le premier utilisateur cree devient proprietaire."
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        "201":
          description: "Compte cree"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/Validation"

  /api/login:
    post:
      tags: [Auth]
      summary: "Se connecter"
      description: "Authentification. Peut repondre `requires_two_factor: true` si la 2FA est activee."
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: "Connecte ou 2FA requis"
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      token:
                        type: string
                      user:
                        $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      requires_two_factor:
                        type: boolean
                        example: true
                      two_factor_token:
                        type: string
        "422":
          $ref: "#/components/responses/Validation"

  /api/forgot-password:
    post:
      tags: [Auth]
      summary: "Demander une reinitialisation de mot de passe"
      security: []
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: "Email envoye si l'adresse existe"

  /api/reset-password:
    post:
      tags: [Auth]
      summary: "Reinitialiser le mot de passe"
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        "200":
          description: "Mot de passe reinitialise"
        "422":
          $ref: "#/components/responses/Validation"

  # ──────────────────────────────────────
  # AUTH (session management)
  # ──────────────────────────────────────
  /api/logout:
    post:
      tags: [Auth]
      summary: "Se deconnecter"
      description: "Revoque le token Sanctum courant."
      operationId: logout
      responses:
        "200":
          description: "Deconnexion reussie"

  /api/refresh:
    post:
      tags: [Auth]
      summary: "Rafraichir le token"
      operationId: refreshToken
      responses:
        "200":
          description: "Nouveau token"
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /api/me:
    get:
      tags: [Auth]
      summary: "Obtenir l'utilisateur courant"
      operationId: getMe
      responses:
        "200":
          description: "Profil utilisateur"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/profile:
    put:
      tags: [Auth]
      summary: "Mettre a jour le profil"
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
      responses:
        "200":
          description: "Profil mis a jour"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /api/me/password:
    put:
      tags: [Auth]
      summary: "Changer le mot de passe"
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
      responses:
        "200":
          description: "Mot de passe change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /api/2fa/enable:
    post:
      tags: [Auth]
      summary: "Activer la double authentification"
      description: "Genere un QR code et des codes de secours."
      operationId: enable2fa
      responses:
        "200":
          description: "2FA preparee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  qr_code:
                    type: string
                    description: "URL du QR code en base64"
                  recovery_codes:
                    type: array
                    items:
                      type: string

  /api/2fa/confirm:
    post:
      tags: [Auth]
      summary: "Confirmer l'activation de la 2FA"
      operationId: confirm2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: "2FA activee"
        "422":
          $ref: "#/components/responses/Validation"

  /api/2fa/disable:
    post:
      tags: [Auth]
      summary: "Desactiver la 2FA"
      operationId: disable2fa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: "2FA desactivee"
        "422":
          $ref: "#/components/responses/Validation"

  # ──────────────────────────────────────
  # MULTI-BOUTIQUE
  # ──────────────────────────────────────
  /api/switch-boutique:
    post:
      tags: [Multi-boutique]
      summary: "Changer de boutique courante"
      description: "Definit la boutique courante pour toutes les operations ulterieures."
      operationId: switchBoutique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boutique_id]
              properties:
                boutique_id:
                  type: integer
      responses:
        "200":
          description: "Boutique changee"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  current_boutique_id:
                    type: integer
                  current_boutique:
                    $ref: "#/components/schemas/Boutique"
                  role_courant:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/mes-boutiques:
    get:
      tags: [Multi-boutique]
      summary: "Lister mes boutiques"
      description: "Retourne la liste des boutiques auxquelles l'utilisateur a acces."
      operationId: mesBoutiques
      responses:
        "200":
          description: "Liste des boutiques"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Boutique"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/boutique/settings:
    get:
      tags: [Multi-boutique]
      summary: "Obtenir les parametres de la boutique courante"
      operationId: getBoutiqueSettings
      responses:
        "200":
          description: "Parametres de la boutique"
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Multi-boutique]
      summary: "Mettre a jour les parametres de la boutique"
      operationId: updateBoutiqueSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                email:
                  type: string
      responses:
        "200":
          description: "Parametres mis a jour"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  # ──────────────────────────────────────
  # BOUTIQUES (proprietaire)
  # ──────────────────────────────────────
  /api/boutiques:
    get:
      tags: [Multi-boutique]
      summary: "Lister les boutiques"
      description: "Reserve au proprietaire. Liste toutes les boutiques du compte."
      operationId: listBoutiques
      responses:
        "200":
          description: "Liste des boutiques"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Boutique"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Multi-boutique]
      summary: "Creer une boutique"
      description: "Reserve au proprietaire."
      operationId: createBoutique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Boutique"
      responses:
        "201":
          description: "Boutique creee"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boutique"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /api/boutiques/{boutique}:
    get:
      tags: [Multi-boutique]
      summary: "Obtenir une boutique"
      operationId: getBoutique
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
      responses:
        "200":
          description: "Boutique"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boutique"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Multi-boutique]
      summary: "Modifier une boutique"
      description: "Reserve au proprietaire."
      operationId: updateBoutique
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Boutique"
      responses:
        "200":
          description: "Boutique mise a jour"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [Multi-boutique]
      summary: "Supprimer une boutique"
      description: "Reserve au proprietaire."
      operationId: deleteBoutique
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
      responses:
        "200":
          description: "Boutique supprimee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────
  # EQUIPE (boutique.manage)
  # ──────────────────────────────────────
  /api/boutiques/{boutique}/users:
    get:
      tags: [Utilisateurs & Equipe]
      summary: "Lister les utilisateurs d'une boutique"
      description: "Necessite la permission boutique.manage (proprietaire ou gerant)."
      operationId: listBoutiqueUsers
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
      responses:
        "200":
          description: "Liste des utilisateurs"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Utilisateurs & Equipe]
      summary: "Ajouter un utilisateur a la boutique"
      operationId: addBoutiqueUser
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id:
                  type: integer
                role:
                  type: string
                  enum: [proprietaire, gerant, caissier]
      responses:
        "201":
          description: "Utilisateur ajoute"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /api/boutiques/{boutique}/users/{userId}:
    delete:
      tags: [Utilisateurs & Equipe]
      summary: "Retirer un utilisateur de la boutique"
      operationId: removeBoutiqueUser
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Utilisateur retire"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/boutiques/{boutique}/users/{user}/assignUser:
    post:
      tags: [Utilisateurs & Equipe]
      summary: "Assigner un role a un utilisateur dans la boutique"
      operationId: assignBoutiqueUser
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
        - name: user
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [proprietaire, gerant, caissier]
      responses:
        "200":
          description: "Role assigne"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /api/boutiques/{boutique}/users/{user}/removeUser:
    delete:
      tags: [Utilisateurs & Equipe]
      summary: "Retirer le role d'un utilisateur dans la boutique"
      operationId: removeRoleBoutiqueUser
      parameters:
        - $ref: "#/components/parameters/BoutiqueId"
        - name: user
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: "Role retire"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────
  # USERS (role.gerant)
  # ──────────────────────────────────────
  /api/users/caissiers:
    get:
      tags: [Utilisateurs & Equipe]
      summary: "Lister les caissiers de la boutique"
      operationId: listCaissiers
      responses:
        "200":
          description: "Liste des caissiers"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users:
    get:
      tags: [Utilisateurs & Equipe]
      summary: "Lister les utilisateurs"
      description: "Necessite le role gerant ou proprietaire."
      operationId: listUsers
      responses:
        "200":
          description: "Liste des utilisateurs"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Utilisateurs & Equipe]
      summary: "Creer un utilisateur"
      description: "Necessite le role gerant ou proprietaire."
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [proprietaire, gerant, caissier]
      responses:
        "201":
          description: "Utilisateur cree"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /api/users/invite:
    post:
      tags: [Utilisateurs & Equipe]
      summary: "Inviter un utilisateur par email"
      operationId: inviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [proprietaire, gerant, caissier]
      responses:
        "200":
          description: "Invitation envoyee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /api/users/export:
    post:
      tags: [Utilisateurs & Equipe]
      summary: "Exporter les utilisateurs"
      operationId: exportUsers
      responses:
        "200":
          description: "Fichier exporte"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/users/import:
    post:
      tags: [Utilisateurs & Equipe]
      summary: "Importer des utilisateurs"
      operationId: importUsers
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: "Import reussi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /api/users/{user}:
    put:
      tags: [Utilisateurs & Equipe]
      summary: "Modifier un utilisateur"
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [proprietaire, gerant, caissier]
      responses:
        "200":
          description: "Utilisateur mis a jour"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      tags: [Utilisateurs & Equipe]
      summary: "Supprimer un utilisateur"
      operationId: deleteUser
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: "Utilisateur supprime"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/{user}/assign-boutique:
    post:
      tags: [Utilisateurs & Equipe]
      summary: "Assigner un utilisateur a une boutique"
      operationId: assignUserBoutique
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
